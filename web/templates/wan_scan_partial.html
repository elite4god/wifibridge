{{if .Networks}}
<div class="list-group shadow-sm">
    {{range .Networks}}
    <button type="button" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between p-3"
            onclick="selectNetwork('{{.SSID}}', '{{.Security}}')">
        <div class="d-flex align-items-center">
            <i class="bi bi-wifi fs-4 me-3 {{if ge .SignalBars 3}}text-success{{else if ge .SignalBars 2}}text-warning{{else}}text-muted{{end}}"></i>
            <div>
                <strong class="d-block">{{.SSID}}</strong>
                <span class="badge bg-light text-dark border me-1">{{.Security}}</span>
                <span class="text-muted small">Signal: {{.SignalPercent}}%</span>
            </div>
        </div>
        <div>
            <span class="btn btn-outline-primary btn-sm">Select</span>
        </div>
    </button>
    {{end}}
</div>
{{else}}
<div class="alert alert-info py-2 small m-0">No Wi-Fi networks found in current scan.</div>
{{end}}
